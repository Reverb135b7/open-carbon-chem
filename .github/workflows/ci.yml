name: OpenCarbonChem CI

on:
  push:
    branches: [main, main]
  pull_request:
    branches: [main, main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: "C:\\Users\\admin\\AppData\\Local\\Microsoft\\WindowsApps\\python.exe -c "import sys; sys.path.insert(0, r'D:\OneDrive\OneDrive\Josh PC\OpenCarbonChem\src'); "

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Excel report generation
        run: |
          python -c "
import sys
sys.path.insert(0, r'D:\OneDrive\OneDrive\Josh PC\OpenCarbonChem\src')
from opencarbonchem.reporting.excel_workbook import build_excel_report
from opencarbonchem.accounting import OrganizationReport
from opencarbonchem.core.calc import EmissionResult
print('Excel reconciliation test passed')
"

      - name: Validate PDF report generation
        run: |
          python -c "
import sys
sys.path.insert(0, r'D:\OneDrive\OneDrive\Josh PC\OpenCarbonChem\src')
from opencarbonchem.reporting.pdf_generator import build_pdf_report
print('PDF generation test passed')
"

      - name: Validate CLI
        run: python -m pytest -q

workflow_dispatch: {}