name: OpenCarbonChem CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the CLI entry point
        run: |
          opencarbonchem --help > /dev/null
          opencarbonchem calculate \
            --activities data/activities_synthetic.csv \
            --run-id ci-smoke \
            --out build/reports
          test -f build/reports/ci-smoke.xlsx
          test -f build/reports/ci-smoke.pdf
